
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Digital Universe</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #03050c;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
}

canvas {
  display: block;
}

#title {
  position: fixed;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 10;
  pointer-events: none;
  width: 100%;
}

#title h1 {
  font-size: clamp(20px, 4vw, 32px);
  font-weight: 300;
  letter-spacing: 6px;
  text-shadow: 0 0 20px #00cfff;
}

#title p {
  margin-top: 10px;
  font-size: 11px;
  letter-spacing: 4px;
  color: #a5c9dc;
}

#instructions {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  font-size: 10px;
  letter-spacing: 2px;
  color: #9ab6c8;
  z-index: 10;
  width: 100%;
  pointer-events: none;
}

#viewer {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.96);
  z-index: 30;
  justify-content: center;
  align-items: center;
}

#viewer img,
#viewer video {
  max-width: 90vw;
  max-height: 82vh;
  border: 1px solid #00d9ff;
  box-shadow: 0 0 35px #00cfff55;
}

#close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 40px;
  color: white;
  cursor: pointer;
  z-index: 40;
}
</style>
</head>

<body>

<div id="title">
  <h1>MY DIGITAL UNIVERSE</h1>
  <p>A WEB OF MEMORIES</p>
</div>

<div id="instructions">
  DRAG TO ROTATE · SCROLL TO ZOOM · CLICK A PHOTO
</div>

<div id="viewer">
  <span id="close">&times;</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// ==========================================
// 1. CREATE THE SCENE
// ==========================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x03050c);

const camera = new THREE.PerspectiveCamera(
  65,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.z = 22;

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

document.body.appendChild(renderer.domElement);


// ==========================================
// 2. LIGHTING
// ==========================================

scene.add(
  new THREE.AmbientLight(0xffffff, 1.3)
);

const blueLight = new THREE.PointLight(
  0x00cfff,
  3,
  70
);

blueLight.position.set(5, 5, 10);

scene.add(blueLight);


// ==========================================
// 3. MAIN WEB GROUP
// ==========================================

const group = new THREE.Group();

scene.add(group);


// ==========================================
// 4. CREATE SPHERICAL WEB POINTS
// ==========================================

const nodes = [];

const nodeCount = 180;

const radius = 8;

for (let i = 0; i < nodeCount; i++) {

  const phi = Math.acos(
    1 - 2 * (i + 0.5) / nodeCount
  );

  const theta =
    Math.PI * (1 + Math.sqrt(5)) * i;

  const x =
    radius * Math.sin(phi) * Math.cos(theta);

  const y =
    radius * Math.sin(phi) * Math.sin(theta);

  const z =
    radius * Math.cos(phi);

  nodes.push(
    new THREE.Vector3(x, y, z)
  );

}


// ==========================================
// 5. CONNECT THE POINTS WITH WEB LINES
// ==========================================

const lineMaterial = new THREE.LineBasicMaterial({
  color: 0x27cfff,
  transparent: true,
  opacity: 0.4
});

for (let i = 0; i < nodes.length; i++) {

  for (let j = i + 1; j < nodes.length; j++) {

    const distance =
      nodes[i].distanceTo(nodes[j]);

    if (distance < 2.8) {

      const geometry =
        new THREE.BufferGeometry().setFromPoints([
          nodes[i],
          nodes[j]
        ]);

      const line =
        new THREE.Line(geometry, lineMaterial);

      group.add(line);

    }

  }

}


// ==========================================
// 6. ADD GLOWING NODES
// ==========================================

const nodeGeometry =
  new THREE.SphereGeometry(0.045, 8, 8);

const nodeMaterial =
  new THREE.MeshBasicMaterial({
    color: 0x9ceeff
  });

nodes.forEach(position => {

  const dot = new THREE.Mesh(
    nodeGeometry,
    nodeMaterial
  );

  dot.position.copy(position);

  group.add(dot);

});


// ==========================================
// 7. ADD 11 EQUALLY DISTRIBUTED PHOTOS
// ==========================================

const cards = [];

const textureLoader = new THREE.TextureLoader();

// Put your 11 photo paths here
const photoUrls = [
  "images/photo1.jpg",
  "images/photo2.jpg",
  "images/photo3.jpg",
  "images/photo4.jpg",
  "images/photo5.jpg",
  "images/photo6.jpg",
  "images/photo7.jpg",
  "images/photo8.jpg",
  "images/photo9.jpg",
  "images/photo10.jpg",
  "images/photo11.jpg"
];

const photoCount = 11;
const photoRadius = 8.8;

// Golden angle gives an even distribution over a sphere
const goldenAngle = Math.PI * (3 - Math.sqrt(5));

for (let i = 0; i < photoCount; i++) {

  const y = 1 - (i / (photoCount - 1)) * 2;

  const radiusAtY = Math.sqrt(1 - y * y);

  const theta = goldenAngle * i;

  const x = Math.cos(theta) * radiusAtY;
  const z = Math.sin(theta) * radiusAtY;

  const position = new THREE.Vector3(
    x * photoRadius,
    y * photoRadius,
    z * photoRadius
  );

  const geometry = new THREE.PlaneGeometry(2, 1.5);

  const material = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    side: THREE.DoubleSide
  });

  const card = new THREE.Mesh(geometry, material);

  card.position.copy(position);

  // Make each photo face outward from the sphere
  card.lookAt(
    position.clone().multiplyScalar(2)
  );

  card.userData = {
    type: "image",
    url: photoUrls[i]
  };

  group.add(card);

  cards.push(card);

  textureLoader.load(
    photoUrls[i],
    texture => {
      card.material.map = texture;
      card.material.needsUpdate = true;
    }
  );

}



// ==========================================
// 8. BACKGROUND STARS
// ==========================================

const starGeometry =
  new THREE.BufferGeometry();

const starPositions = [];

for (let i = 0; i < 1000; i++) {

  starPositions.push(
    (Math.random() - 0.5) * 80,
    (Math.random() - 0.5) * 80,
    (Math.random() - 0.5) * 80
  );

}

starGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(
    starPositions,
    3
  )
);

const starMaterial =
  new THREE.PointsMaterial({
    color: 0x9ccfff,
    size: 0.045
  });

const stars = new THREE.Points(
  starGeometry,
  starMaterial
);

scene.add(stars);


// ==========================================
// 9. MOUSE AND TOUCH CONTROLS
// ==========================================

let dragging = false;

let previousX = 0;
let previousY = 0;

let rx = 0;
let ry = 0;

let targetX = 0;
let targetY = 0;

renderer.domElement.addEventListener(
  "pointerdown",
  event => {

    dragging = true;

    previousX = event.clientX;
    previousY = event.clientY;

  }
);

window.addEventListener(
  "pointerup",
  () => {

    dragging = false;

  }
);

window.addEventListener(
  "pointermove",
  event => {

    if (!dragging) return;

    const movementX =
      event.clientX - previousX;

    const movementY =
      event.clientY - previousY;

    targetY += movementX * 0.005;

    targetX += movementY * 0.005;

    previousX = event.clientX;
    previousY = event.clientY;

  }
);


// ==========================================
// 10. ZOOM CONTROL
// ==========================================

window.addEventListener(
  "wheel",
  event => {

    camera.position.z += event.deltaY * 0.01;

    camera.position.z = Math.max(
      10,
      Math.min(40, camera.position.z)
    );

  }
);


// ==========================================
// 11. OPEN PHOTOS AND VIDEOS
// ==========================================

const raycaster = new THREE.Raycaster();

const mouse = new THREE.Vector2();

const viewer =
  document.getElementById("viewer");

renderer.domElement.addEventListener(
  "click",
  event => {

    mouse.x =
      (event.clientX / window.innerWidth) * 2 - 1;

    mouse.y =
      -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);

    const hits =
      raycaster.intersectObjects(cards);

    if (hits.length === 0) return;

    const item = hits[0].object.userData;

    viewer.innerHTML =
      '<span id="close">&times;</span>';

    if (item.type === "image") {

      const image =
        document.createElement("img");

      image.src = item.url;

      viewer.appendChild(image);

    } else {

      const video =
        document.createElement("video");

      video.src = item.url;

      video.controls = true;
      video.autoplay = true;

      viewer.appendChild(video);

    }

    viewer.style.display = "flex";

    document.getElementById("close").onclick =
      () => {

        viewer.style.display = "none";

        viewer.innerHTML =
          '<span id="close">&times;</span>';

      };

  }
);


// Close viewer when clicking outside media
viewer.addEventListener("click", event => {

  if (event.target === viewer) {

    viewer.style.display = "none";
    viewer.innerHTML =
      '<span id="close">&times;</span>';

  }

});


// ==========================================
// 12. SPEED UP FAST THEN SLOW DOWN
// ==========================================

let rotationTime = 0;

let previousFrameTime = 0;

// Rotation settings
const slowSpeed = 0.00035;

const fastSpeed = 0.012;

// Full cycle in milliseconds
const cycleDuration = 12000;


// ==========================================
// 13. ANIMATION LOOP
// ==========================================

function animate(timestamp) {

  requestAnimationFrame(animate);

  if (!previousFrameTime) {
    previousFrameTime = timestamp;
  }

  const deltaTime = Math.min(
    timestamp - previousFrameTime,
    50
  );

  previousFrameTime = timestamp;

  // Advance animation based on elapsed time
  rotationTime += deltaTime;

  const progress =
    (rotationTime % cycleDuration) /
    cycleDuration;

  let speed;

  if (progress < 0.5) {

    // Accelerate during the first half
    const t = progress / 0.5;

    const smooth =
      t * t * (3 - 2 * t);

    speed =
      slowSpeed +
      (fastSpeed - slowSpeed) * smooth;

  } else {

    // Decelerate during the second half
    const t = (progress - 0.5) / 0.5;

    const smooth =
      t * t * (3 - 2 * t);

    speed =
      fastSpeed +
      (slowSpeed - fastSpeed) * smooth;

  }

  // Automatic rotation pauses while dragging
  if (!dragging) {

    targetY += speed * (deltaTime / 16.67);

  }

  // Smooth rotation
  rx += (targetX - rx) * 0.025;

  ry += (targetY - ry) * 0.025;

  group.rotation.x = rx;

  group.rotation.y = ry;

  // Keep photos facing the camera
  cards.forEach(card => {

    card.lookAt(camera.position);

  });

  // Slowly rotate background stars
  stars.rotation.y += 0.0001;

  renderer.render(scene, camera);

}

requestAnimationFrame(animate);


// ==========================================
// 14. MOBILE AND DESKTOP RESIZING
// ==========================================

window.addEventListener("resize", () => {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

</script>

</body>
</html>

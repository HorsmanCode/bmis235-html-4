
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Digital Spider Web</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #05060d;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
}

canvas {
  display: block;
}

#title {
  position: fixed;
  top: 25px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  text-align: center;
  pointer-events: none;
}

#title h1 {
  font-size: 26px;
  letter-spacing: 5px;
  font-weight: 300;
  text-shadow: 0 0 15px #70dfff;
}

#title p {
  margin-top: 8px;
  font-size: 11px;
  letter-spacing: 3px;
  color: #9bbacb;
}

#instructions {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  color: #91a8b8;
  font-size: 11px;
  letter-spacing: 2px;
  text-align: center;
  pointer-events: none;
  z-index: 10;
}

#viewer {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(0,0,0,.94);
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

#viewer img,
#viewer video {
  max-width: 90vw;
  max-height: 80vh;
  border: 1px solid #5ceaff;
  box-shadow: 0 0 30px #00bfff55;
}

#close {
  position: absolute;
  top: 25px;
  right: 30px;
  font-size: 32px;
  cursor: pointer;
  color: white;
}
</style>
</head>

<body>

<div id="title">
  <h1>MY DIGITAL UNIVERSE</h1>
  <p>A WEB OF MEMORIES</p>
</div>

<div id="instructions">
  DRAG TO ROTATE · SCROLL TO ZOOM · CLICK A PHOTO
</div>

<div id="viewer">
  <span id="close">&times;</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// ===================================
// 1. CREATE THE 3D SCENE
// ===================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x05060d);

const camera = new THREE.PerspectiveCamera(
  65,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.z = 22;

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

document.body.appendChild(renderer.domElement);


// ===================================
// 2. LIGHTING
// ===================================

const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
scene.add(ambientLight);

const blueLight = new THREE.PointLight(0x00cfff, 3, 60);
blueLight.position.set(5, 5, 10);
scene.add(blueLight);


// ===================================
// 3. MAIN SPIDER WEB GROUP
// ===================================

const group = new THREE.Group();
scene.add(group);


// ===================================
// 4. CREATE THE WEB STRUCTURE
// ===================================

const nodes = [];

const nodeCount = 180;
const radius = 8;

for (let i = 0; i < nodeCount; i++) {

  const phi = Math.acos(1 - 2 * (i + 0.5) / nodeCount);
  const theta = Math.PI * (1 + Math.sqrt(5)) * i;

  const x = radius * Math.sin(phi) * Math.cos(theta);
  const y = radius * Math.sin(phi) * Math.sin(theta);
  const z = radius * Math.cos(phi);

  nodes.push(new THREE.Vector3(x, y, z));
}


// ===================================
// 5. DRAW THE WEB LINES
// ===================================

const lineMaterial = new THREE.LineBasicMaterial({
  color: 0x35cfff,
  transparent: true,
  opacity: 0.35
});

for (let i = 0; i < nodes.length; i++) {

  for (let j = i + 1; j < nodes.length; j++) {

    const distance = nodes[i].distanceTo(nodes[j]);

    if (distance < 2.8) {

      const geometry = new THREE.BufferGeometry().setFromPoints([
        nodes[i],
        nodes[j]
      ]);

      const line = new THREE.Line(geometry, lineMaterial);

      group.add(line);
    }
  }
}


// ===================================
// 6. ADD GLOWING WEB NODES
// ===================================

const nodeGeometry = new THREE.SphereGeometry(0.045, 8, 8);

const nodeMaterial = new THREE.MeshBasicMaterial({
  color: 0x8ceeff
});

nodes.forEach(position => {

  const dot = new THREE.Mesh(nodeGeometry, nodeMaterial);

  dot.position.copy(position);

  group.add(dot);
});


// ===================================
// 7. ADD YOUR PHOTOS AND VIDEOS
// ===================================

// Replace these example image URLs with your own.
// For GitHub Pages, you can upload photos into an "images" folder.

const mediaItems = [

  {
    type: "image",
    url: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800"
  },

  {
    type: "image",
    url: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800"
  },

  {
    type: "image",
    url: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800"
  },

  {
    type: "image",
    url: "https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=800"
  },

  {
    type: "image",
    url: "https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=800"
  },

  {
    type: "image",
    url: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800"
  },

  {
    type: "video",
    url: "https://www.w3schools.com/html/mov_bbb.mp4"
  }

];

const cards = [];

const loader = new THREE.TextureLoader();

mediaItems.forEach((item, index) => {

  const position = nodes[index * 12];

  const geometry = new THREE.PlaneGeometry(1.7, 1.25);

  const material = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    side: THREE.DoubleSide
  });

  const card = new THREE.Mesh(geometry, material);

  card.position.copy(position);

  card.userData = item;

  group.add(card);

  cards.push(card);

  if (item.type === "image") {

    loader.load(item.url, texture => {

      card.material.map = texture;
      card.material.needsUpdate = true;

    });

  } else {

    // A video placeholder panel
    card.material.color.set(0x123044);

  }

});


// ===================================
// 8. ADD BACKGROUND STARS
// ===================================

const starGeometry = new THREE.BufferGeometry();

const starPositions = [];

for (let i = 0; i < 900; i++) {

  starPositions.push(
    (Math.random() - 0.5) * 80,
    (Math.random() - 0.5) * 80,
    (Math.random() - 0.5) * 80
  );

}

starGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(starPositions, 3)
);

const starMaterial = new THREE.PointsMaterial({
  color: 0x9ccfff,
  size: 0.045
});

const stars = new THREE.Points(starGeometry, starMaterial);

scene.add(stars);


// ===================================
// 9. MOUSE AND TOUCH ROTATION
// ===================================

let dragging = false;

let previousX = 0;
let previousY = 0;

let rx = 0;
let ry = 0;

let targetX = 0;
let targetY = 0;

renderer.domElement.addEventListener("pointerdown", event => {

  dragging = true;

  previousX = event.clientX;
  previousY = event.clientY;

});

window.addEventListener("pointerup", () => {

  dragging = false;

});

window.addEventListener("pointermove", event => {

  if (!dragging) return;

  const movementX = event.clientX - previousX;
  const movementY = event.clientY - previousY;

  targetY += movementX * 0.005;
  targetX += movementY * 0.005;

  previousX = event.clientX;
  previousY = event.clientY;

});


// ===================================
// 10. SCROLL TO ZOOM
// ===================================

window.addEventListener("wheel", event => {

  camera.position.z += event.deltaY * 0.01;

  camera.position.z = Math.max(
    10,
    Math.min(40, camera.position.z)
  );

});


// ===================================
// 11. CLICK PHOTOS TO OPEN THEM
// ===================================

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

const viewer = document.getElementById("viewer");

renderer.domElement.addEventListener("click", event => {

  if (Math.abs(event.clientX - previousX) > 5 ||
      Math.abs(event.clientY - previousY) > 5) {
    // Ignore a click that was part of a drag
  }

  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObjects(cards);

  if (hits.length > 0) {

    const item = hits[0].object.userData;

    viewer.innerHTML = '<span id="close">&times;</span>';

    if (item.type === "image") {

      const image = document.createElement("img");

      image.src = item.url;

      viewer.appendChild(image);

    } else {

      const video = document.createElement("video");

      video.src = item.url;
      video.controls = true;
      video.autoplay = true;

      viewer.appendChild(video);

    }

    viewer.style.display = "flex";

    document.getElementById("close").onclick = () => {

      viewer.style.display = "none";
      viewer.innerHTML = '<span id="close">&times;</span>';

    };

  }

});


// ===================================
// 12. SLOW CONTINUOUS ROTATION
// ===================================

const rotationSpeed = 0.00035;

function animate() {

  requestAnimationFrame(animate);

  // Slowly rotate automatically when you are not dragging
  if (!dragging) {
    targetY += rotationSpeed;
  }

  // Smooth manual and automatic movement
  rx += (targetX - rx) * 0.025;
  ry += (targetY - ry) * 0.025;

  group.rotation.x = rx;
  group.rotation.y = ry;

  // Keep photo panels facing the camera
  cards.forEach(card => {
    card.lookAt(camera.position);
  });

  // Slowly move the stars
  stars.rotation.y += 0.0001;

  renderer.render(scene, camera);

}

animate();


// ===================================
// 13. RESPONSIVE WINDOW RESIZING
// ===================================

window.addEventListener("resize", () => {

  camera.aspect = window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

</script>

</body>
</html>

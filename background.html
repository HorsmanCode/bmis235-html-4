<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Athena – Background</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--text:#f2f2f2;--accent:#ffe600;--card:#111;--border:#2a2a2a;--muted:#aaa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;font-family:'Bebas Neue',Impact,sans-serif;background:var(--bg);color:var(--text);letter-spacing:.06em}

nav{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:20px 16px 0}
nav a{color:var(--text);text-decoration:none;font-size:1.25rem;padding:8px 20px;border-radius:999px;border:1px solid transparent;transition:.25s}
nav a:hover{border-color:var(--accent);color:var(--accent)}
nav a.active{background:var(--accent);color:#000}

h1{color:var(--accent);font-weight:400;text-align:center;font-size:clamp(2.2rem,6vw,3.4rem);margin:36px 16px 6px}
.sub{text-align:center;color:var(--muted);font-size:1.2rem;margin:0 16px 28px}

.wrap{max-width:900px;margin:0 auto;padding:0 20px}

.btn{display:inline-block;text-decoration:none;background:var(--accent);color:#000;font-size:1.3rem;padding:10px 24px;border-radius:999px;transition:.25s}
.btn:hover{box-shadow:0 0 22px rgba(255,230,0,.5);transform:translateY(-2px)}

/* ID card */
.id{max-width:620px;margin:0 auto;background:var(--card);border:2px solid var(--accent);border-radius:18px;overflow:hidden;transition:transform .3s,box-shadow .3s}
.id:hover{transform:rotate(-1deg) scale(1.02);box-shadow:0 0 30px rgba(255,230,0,.3)}
.id-top{background:var(--accent);color:#000;display:flex;justify-content:space-between;padding:10px 20px;font-size:1.3rem}
.id-body{display:flex;gap:24px;padding:24px;flex-wrap:wrap}
.avatar{width:130px;height:130px;border-radius:50%;border:4px solid var(--accent);display:grid;place-items:center;font-size:4rem;background:#000;flex:none;margin:0 auto}
.fields{flex:1;min-width:220px;display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.fields div span{display:block;color:var(--muted);font-size:.95rem}
.fields div b{font-weight:400;font-size:1.5rem}
.fields .wide{grid-column:1/-1}
.id-bot{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;border-top:1px dashed var(--border);flex-wrap:wrap}
.barcode{flex:1;min-width:140px;height:34px;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 5px,#fff 5px 6px,transparent 6px 10px,#fff 10px 13px,transparent 13px 16px)}

footer{text-align:center;color:var(--muted);font-size:1rem;padding:30px 16px 40px}
</style>
</head>
<body>


<h1>Background</h1>
<p class="sub">Meet Athena</p>

<main class="wrap">
  <div class="id">
    <div class="id-top"><span>ATHENA</span><span>SAMOYED · OFFICIAL ID</span></div>
    <div class="id-body">
      <div class="avatar">🐕</div>
      <div class="fields">
        <div><span>BREED</span><b>Samoyed</b></div>
        <div><span>GENDER</span><b>Female</b></div>
        <div><span>BORN</span><b>April 2024</b></div>
        <div><span>AGE</span><b class="age">2 years</b></div>
        <div class="wide"><span>HOME CITY</span><b>Calgary, Alberta, Canada</b></div>
      </div>
    </div>
    <div class="id-bot">
      <div class="barcode"></div>
      <a class="btn" href="https://en.wikipedia.org/wiki/Samoyed_dog" target="_blank" rel="noopener">About the breed</a>
    </div>
  </div>
</main>

<footer>Built by Nathaniel Horsman · BMIS 235</footer>

<script>
// Age updates automatically from April 2024
var born=new Date(2024,3,1),now=new Date();
var m=(now.getFullYear()-born.getFullYear())*12+now.getMonth()-born.getMonth();
var y=Math.floor(m/12),r=m%12;
var txt=y+(y===1?' year':' years')+(r?' '+r+(r===1?' month':' months'):'');
document.querySelectorAll('.age').forEach(function(e){e.textContent=txt});
</script>
</body>
</html>
